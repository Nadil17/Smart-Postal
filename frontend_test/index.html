<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Postal Route Optimization System - Real-Time Auto-Rerouting</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .map-container { height: 100%; width: 100%; }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .pulse { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        @keyframes slideIn {
            from { transform: translateY(-100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .slide-in { animation: slideIn 0.5s ease-out; }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        .bounce { animation: bounce 1s infinite; }
        @keyframes dash {
            to { stroke-dashoffset: 20; }
        }
        .dashed-animation { animation: dash 20s linear infinite; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const API_BASE = 'http://localhost:8000/api';
        const GOOGLE_MAPS_API_KEY = 'AIzaSyB_996Uyid5qMajR-4PJY0EcpO6Prp_n4c';
        const DEFAULT_CENTER = { lat: 6.9271, lng: 79.8612 };
        
        const CONDITION_CHECK_INTERVAL = 10;
        const ROUTE_UPDATE_THRESHOLD = 10;

        const loadGoogleMapsScript = () => {
            return new Promise((resolve, reject) => {
                if (window.google && window.google.maps) {
                    resolve();
                    return;
                }
                const script = document.createElement('script');
                script.src = `https://maps.googleapis.com/maps/api/js?key=${GOOGLE_MAPS_API_KEY}&libraries=geometry`;
                script.async = true;
                script.defer = true;
                script.onload = resolve;
                script.onerror = reject;
                document.head.appendChild(script);
            });
        };

        const geocodeAddress = async (address) => {
            try {
                await new Promise(resolve => setTimeout(resolve, 1000));
                const response = await fetch(
                    `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(address + ', Sri Lanka')}&limit=1`,
                    { headers: { 'User-Agent': 'PostalRouteOptimization/1.0' } }
                );
                const data = await response.json();
                
                if (data && data.length > 0) {
                    return {
                        latitude: parseFloat(data[0].lat),
                        longitude: parseFloat(data[0].lon),
                        success: true
                    };
                }
                
                return {
                    latitude: DEFAULT_CENTER.lat + (Math.random() - 0.5) * 0.1,
                    longitude: DEFAULT_CENTER.lng + (Math.random() - 0.5) * 0.1,
                    success: false,
                    fallback: true
                };
            } catch (error) {
                console.error('Geocoding error:', error);
                return {
                    latitude: DEFAULT_CENTER.lat + (Math.random() - 0.5) * 0.1,
                    longitude: DEFAULT_CENTER.lng + (Math.random() - 0.5) * 0.1,
                    success: false,
                    fallback: true
                };
            }
        };

        const addArrowToPolyline = (map, path, color) => {
            const arrowSymbol = {
                path: google.maps.SymbolPath.FORWARD_CLOSED_ARROW,
                scale: 3,
                strokeColor: color,
                fillColor: color,
                fillOpacity: 1
            };

            return new google.maps.Polyline({
                path: path,
                geodesic: true,
                strokeColor: color,
                strokeOpacity: 0.8,
                strokeWeight: 4,
                icons: [{
                    icon: arrowSymbol,
                    offset: '50%'
                }],
                map: map
            });
        };

        const MapView = ({ deliveries, route, center, zoom = 13, showRoute = false, 
                          comparisonMode = false, baselineRoute = null, optimalRoute = null,
                          showLabels = true, relocationMode = false, relocationData = null,
                          beforeDeliveries = null, afterDeliveries = null,
                          reroutingMode = false, originalRoute = null, newRoute = null, routeColor = '#10b981' }) => {
            const mapRef = useRef(null);
            const mapInstanceRef = useRef(null);
            const markersRef = useRef([]);
            const polylinesRef = useRef([]);

            useEffect(() => {
                loadGoogleMapsScript().then(() => {
                    if (!mapRef.current || mapInstanceRef.current) return;

                    const map = new google.maps.Map(mapRef.current, {
                        center: { lat: center.lat, lng: center.lng },
                        zoom: zoom,
                        mapTypeControl: true,
                        streetViewControl: true,
                        fullscreenControl: true,
                        zoomControl: true
                    });

                    mapInstanceRef.current = map;
                }).catch(err => console.error('Failed to load Google Maps:', err));

                return () => {
                    markersRef.current.forEach(marker => marker.setMap(null));
                    polylinesRef.current.forEach(polyline => polyline.setMap(null));
                    markersRef.current = [];
                    polylinesRef.current = [];
                };
            }, []);

            // Function to find divergence point between two routes
            const findDivergencePoints = (route1, route2) => {
                let firstDiff = -1;
                let lastDiff = -1;

                for (let i = 0; i < Math.min(route1.length, route2.length); i++) {
                    const dist = google.maps.geometry.spherical.computeDistanceBetween(
                        new google.maps.LatLng(route1[i].latitude, route1[i].longitude),
                        new google.maps.LatLng(route2[i].latitude, route2[i].longitude)
                    );
                    
                    if (dist > 100) { // More than 100 meters difference
                        if (firstDiff === -1) firstDiff = i;
                        lastDiff = i;
                    }
                }

                return { firstDiff, lastDiff };
            };

            useEffect(() => {
                if (!mapInstanceRef.current || !deliveries || !window.google) return;

                const map = mapInstanceRef.current;
                
                markersRef.current.forEach(marker => marker.setMap(null));
                polylinesRef.current.forEach(polyline => polyline.setMap(null));
                markersRef.current = [];
                polylinesRef.current = [];

                // Enhanced Auto-Rerouting Mode
                if (reroutingMode && originalRoute && newRoute) {
                    const originalPath = originalRoute.map(d => ({ lat: d.latitude, lng: d.longitude }));
                    const newPath = newRoute.map(d => ({ lat: d.latitude, lng: d.longitude }));

                    // Find divergence points
                    const { firstDiff, lastDiff } = findDivergencePoints(originalRoute, newRoute);

                    // Draw unchanged portion (gray)
                    if (firstDiff > 0) {
                        const unchangedPath = originalPath.slice(0, firstDiff + 1);
                        const unchangedPolyline = new google.maps.Polyline({
                            path: unchangedPath,
                            geodesic: true,
                            strokeColor: '#9ca3af',
                            strokeOpacity: 0.5,
                            strokeWeight: 6,
                            map: map
                        });
                        polylinesRef.current.push(unchangedPolyline);
                    }

                    // Draw original route (red with dashed pattern for changed segment)
                    if (firstDiff >= 0 && lastDiff >= firstDiff) {
                        const changedOriginalPath = originalPath.slice(firstDiff, lastDiff + 2);
                        const changedOriginalPolyline = new google.maps.Polyline({
                            path: changedOriginalPath,
                            geodesic: true,
                            strokeColor: '#ef4444',
                            strokeOpacity: 0.9,
                            strokeWeight: 5,
                            icons: [{
                                icon: { 
                                    path: 'M 0,-1 0,1', 
                                    strokeOpacity: 1, 
                                    strokeColor: '#ef4444',
                                    scale: 6 
                                },
                                offset: '0',
                                repeat: '15px'
                            }],
                            map: map
                        });
                        polylinesRef.current.push(changedOriginalPolyline);
                    }

                    // Draw new rerouted path (green with arrows for changed segment)
                    if (firstDiff >= 0 && lastDiff >= firstDiff) {
                        const changedNewPath = newPath.slice(firstDiff, lastDiff + 2);
                        const changedNewPolyline = addArrowToPolyline(map, changedNewPath, '#10b981');
                        polylinesRef.current.push(changedNewPolyline);
                    }

                    // Draw remaining route after change
                    if (lastDiff < originalPath.length - 1) {
                        const remainingPath = newPath.slice(lastDiff + 1);
                        const remainingPolyline = new google.maps.Polyline({
                            path: remainingPath,
                            geodesic: true,
                            strokeColor: '#10b981',
                            strokeOpacity: 0.7,
                            strokeWeight: 4,
                            map: map
                        });
                        polylinesRef.current.push(remainingPolyline);
                    }

                    // Mark divergence points
                    if (firstDiff >= 0 && firstDiff < originalPath.length) {
                        const divergenceMarker = new google.maps.Marker({
                            position: originalPath[firstDiff],
                            map: map,
                            icon: {
                                path: google.maps.SymbolPath.CIRCLE,
                                scale: 12,
                                fillColor: '#fbbf24',
                                fillOpacity: 1,
                                strokeColor: '#ffffff',
                                strokeWeight: 3
                            },
                            title: 'Route Divergence Point',
                            animation: google.maps.Animation.BOUNCE
                        });
                        markersRef.current.push(divergenceMarker);

                        const divergenceLabel = new google.maps.InfoWindow({
                            content: '<strong>Routes Diverge Here ⚠️</strong>'
                        });
                        divergenceMarker.addListener('click', () => divergenceLabel.open(map, divergenceMarker));
                    }

                    // Add route labels
                    if (originalPath.length > 1) {
                        const labelPoint = Math.floor(originalPath.length / 4);
                        const originalLabel = new google.maps.Marker({
                            position: originalPath[labelPoint],
                            map: map,
                            icon: {
                                path: google.maps.SymbolPath.CIRCLE,
                                scale: 18,
                                fillColor: '#ef4444',
                                fillOpacity: 1,
                                strokeColor: '#ffffff',
                                strokeWeight: 3
                            },
                            label: { 
                                text: 'OLD', 
                                color: '#ffffff', 
                                fontSize: '11px', 
                                fontWeight: 'bold' 
                            },
                            title: 'Original Route',
                            zIndex: 1000
                        });
                        markersRef.current.push(originalLabel);
                    }

                    if (newPath.length > 1) {
                        const labelPoint = Math.floor(newPath.length * 3 / 4);
                        const newLabel = new google.maps.Marker({
                            position: newPath[labelPoint],
                            map: map,
                            icon: {
                                path: google.maps.SymbolPath.CIRCLE,
                                scale: 18,
                                fillColor: '#10b981',
                                fillOpacity: 1,
                                strokeColor: '#ffffff',
                                strokeWeight: 3
                            },
                            label: { 
                                text: 'NEW', 
                                color: '#ffffff', 
                                fontSize: '11px', 
                                fontWeight: 'bold' 
                            },
                            title: 'New Rerouted Path',
                            zIndex: 1000
                        });
                        markersRef.current.push(newLabel);
                    }
                }

                // Relocation mode
                if (relocationMode && relocationData && baselineRoute && optimalRoute) {
                    const beforePath = baselineRoute.map(d => ({ lat: d.latitude, lng: d.longitude }));
                    const beforePolyline = new google.maps.Polyline({
                        path: beforePath,
                        geodesic: true,
                        strokeColor: '#3b82f6',
                        strokeOpacity: 0.6,
                        strokeWeight: 5,
                        icons: [{ icon: { path: 'M 0,-1 0,1', strokeOpacity: 1, scale: 4 }, offset: '0', repeat: '20px' }],
                        map: map
                    });
                    polylinesRef.current.push(beforePolyline);

                    const afterPath = optimalRoute.map(d => ({ lat: d.latitude, lng: d.longitude }));
                    const afterPolyline = new google.maps.Polyline({
                        path: afterPath,
                        geodesic: true,
                        strokeColor: '#10b981',
                        strokeOpacity: 0.9,
                        strokeWeight: 5,
                        map: map
                    });
                    polylinesRef.current.push(afterPolyline);

                    const oldMarker = new google.maps.Marker({
                        position: { lat: relocationData.old_latitude, lng: relocationData.old_longitude },
                        map: map,
                        icon: {
                            path: google.maps.SymbolPath.CIRCLE,
                            scale: 20,
                            fillColor: '#9ca3af',
                            fillOpacity: 1,
                            strokeColor: '#ffffff',
                            strokeWeight: 3
                        },
                        title: 'Old Location'
                    });
                    markersRef.current.push(oldMarker);

                    const newMarker = new google.maps.Marker({
                        position: { lat: relocationData.new_latitude, lng: relocationData.new_longitude },
                        map: map,
                        icon: {
                            path: google.maps.SymbolPath.CIRCLE,
                            scale: 24,
                            fillColor: '#f59e0b',
                            fillOpacity: 1,
                            strokeColor: '#ffffff',
                            strokeWeight: 4
                        },
                        title: 'New Location',
                        animation: google.maps.Animation.BOUNCE
                    });
                    markersRef.current.push(newMarker);

                    const relocationPath = new google.maps.Polyline({
                        path: [
                            { lat: relocationData.old_latitude, lng: relocationData.old_longitude },
                            { lat: relocationData.new_latitude, lng: relocationData.new_longitude }
                        ],
                        geodesic: true,
                        strokeColor: '#f59e0b',
                        strokeOpacity: 0.8,
                        strokeWeight: 4,
                        icons: [{ icon: { path: 'M 0,-1 0,1', strokeOpacity: 1, scale: 4 }, offset: '0', repeat: '20px' }],
                        map: map
                    });
                    polylinesRef.current.push(relocationPath);

                    const displayDeliveries = afterDeliveries || deliveries;
                    displayDeliveries.forEach((delivery, index) => {
                        if (delivery.id === relocationData.location_id) return;
                        
                        const isUrgent = delivery.priority === 'urgent';
                        const marker = new google.maps.Marker({
                            position: { lat: delivery.latitude, lng: delivery.longitude },
                            map: map,
                            icon: {
                                path: google.maps.SymbolPath.CIRCLE,
                                scale: 14,
                                fillColor: isUrgent ? '#ef4444' : '#3b82f6',
                                fillOpacity: 1,
                                strokeColor: '#ffffff',
                                strokeWeight: 2
                            }
                        });
                        markersRef.current.push(marker);
                    });

                    const bounds = new google.maps.LatLngBounds();
                    displayDeliveries.forEach(d => bounds.extend({ lat: d.latitude, lng: d.longitude }));
                    bounds.extend({ lat: relocationData.old_latitude, lng: relocationData.old_longitude });
                    bounds.extend({ lat: relocationData.new_latitude, lng: relocationData.new_longitude });
                    map.fitBounds(bounds);

                    return;
                }

                // Comparison mode
                if (comparisonMode && baselineRoute && optimalRoute) {
                    const baselinePath = baselineRoute.map(d => ({ lat: d.latitude, lng: d.longitude }));
                    const baselinePolyline = new google.maps.Polyline({
                        path: baselinePath,
                        geodesic: true,
                        strokeColor: '#3b82f6',
                        strokeOpacity: 0.6,
                        strokeWeight: 5,
                        icons: [{ icon: { path: 'M 0,-1 0,1', strokeOpacity: 1, scale: 4 }, offset: '0', repeat: '20px' }],
                        map: map
                    });
                    polylinesRef.current.push(baselinePolyline);

                    const optimalPath = optimalRoute.map(d => ({ lat: d.latitude, lng: d.longitude }));
                    const optimalPolyline = new google.maps.Polyline({
                        path: optimalPath,
                        geodesic: true,
                        strokeColor: '#10b981',
                        strokeOpacity: 0.9,
                        strokeWeight: 5,
                        map: map
                    });
                    polylinesRef.current.push(optimalPolyline);
                }

                // Standard delivery markers
                deliveries.forEach((delivery, index) => {
                    const isUrgent = delivery.priority === 'urgent';
                    
                    const marker = new google.maps.Marker({
                        position: { lat: delivery.latitude, lng: delivery.longitude },
                        map: map,
                        icon: {
                            path: google.maps.SymbolPath.CIRCLE,
                            scale: 16,
                            fillColor: isUrgent ? '#ef4444' : '#3b82f6',
                            fillOpacity: 1,
                            strokeColor: '#ffffff',
                            strokeWeight: 3
                        },
                        label: showLabels ? {
                            text: `${index + 1}`,
                            color: '#ffffff',
                            fontSize: '12px',
                            fontWeight: 'bold'
                        } : null,
                        title: delivery.address
                    });

                    const infoWindow = new google.maps.InfoWindow({
                        content: `
                            <div style="min-width: 220px; padding: 10px;">
                                <strong style="font-size: 15px;">${delivery.address}</strong><br>
                                <div style="margin-top: 10px; padding-top: 8px; border-top: 1px solid #e5e7eb;">
                                    <div style="margin-bottom: 4px;"><strong>Mail Type:</strong> ${delivery.mail_type || 'N/A'}</div>
                                    <div style="margin-bottom: 4px;"><strong>Priority:</strong> <span style="color: ${isUrgent ? '#ef4444' : '#3b82f6'}; font-weight: bold;">${(delivery.priority || 'regular').toUpperCase()}</span></div>
                                    ${showLabels ? `<div><strong>Sequence:</strong> #${index + 1}</div>` : ''}
                                </div>
                            </div>
                        `
                    });

                    marker.addListener('click', () => infoWindow.open(map, marker));
                    markersRef.current.push(marker);
                });

                // Draw single route if not in comparison/rerouting mode
                if (showRoute && route && route.length > 0 && !comparisonMode && !reroutingMode) {
                    const routePath = route.map(d => ({ lat: d.latitude, lng: d.longitude }));
                    const routePolyline = new google.maps.Polyline({
                        path: routePath,
                        geodesic: true,
                        strokeColor: routeColor,
                        strokeOpacity: 0.8,
                        strokeWeight: 5,
                        map: map
                    });
                    polylinesRef.current.push(routePolyline);
                }

                // Add depot marker
                const depotMarker = new google.maps.Marker({
                    position: { lat: center.lat, lng: center.lng },
                    map: map,
                    icon: {
                        path: google.maps.SymbolPath.CIRCLE,
                        scale: 20,
                        fillColor: '#10b981',
                        fillOpacity: 1,
                        strokeColor: '#ffffff',
                        strokeWeight: 3
                    },
                    label: { text: '🏢', fontSize: '20px' },
                    title: 'Postal Depot'
                });

                const depotInfoWindow = new google.maps.InfoWindow({
                    content: '<strong>Postal Depot (Start/End)</strong>'
                });

                depotMarker.addListener('click', () => depotInfoWindow.open(map, depotMarker));
                markersRef.current.push(depotMarker);

                // Fit bounds
                if (deliveries.length > 0) {
                    const bounds = new google.maps.LatLngBounds();
                    deliveries.forEach(d => bounds.extend({ lat: d.latitude, lng: d.longitude }));
                    bounds.extend({ lat: center.lat, lng: center.lng });
                    map.fitBounds(bounds);
                }
            }, [deliveries, route, showRoute, comparisonMode, baselineRoute, optimalRoute, showLabels, relocationMode, relocationData, afterDeliveries, reroutingMode, originalRoute, newRoute]);

            return <div ref={mapRef} className="map-container" />;
        };

        const App = () => {
            const [deliveries, setDeliveries] = useState([]);
            const [allRoutes, setAllRoutes] = useState(null);
            const [currentRoute, setCurrentRoute] = useState(null);
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState(null);
            const [uploadProgress, setUploadProgress] = useState(null);
            const fileInputRef = useRef(null);

            const [currentView, setCurrentView] = useState('upload');
            const [currentConditions, setCurrentConditions] = useState(null);
            const [conditionsLoading, setConditionsLoading] = useState(false);
            
            const [selectedDeliveryId, setSelectedDeliveryId] = useState(null);
            const [newAddress, setNewAddress] = useState('');
            const [newLatitude, setNewLatitude] = useState('');
            const [newLongitude, setNewLongitude] = useState('');
            const [relocationData, setRelocationData] = useState(null);
            const [relocationRoutes, setRelocationRoutes] = useState(null);

            const [autoMonitoring, setAutoMonitoring] = useState(false);
            const [previousConditions, setPreviousConditions] = useState(null);
            const [originalRouteForRerouting, setOriginalRouteForRerouting] = useState(null);
            const [newRouteForRerouting, setNewRouteForRerouting] = useState(null);
            const [impactAnalysis, setImpactAnalysis] = useState(null);
            const [reroutingAlert, setReroutingAlert] = useState(null);
            const [countdown, setCountdown] = useState(CONDITION_CHECK_INTERVAL);
            const [reroutingHistory, setReroutingHistory] = useState([]);

            const [mapCenter, setMapCenter] = useState(DEFAULT_CENTER);

            const monitoringIntervalRef = useRef(null);
            const countdownIntervalRef = useRef(null);

            useEffect(() => {
                loadGoogleMapsScript();
            }, []);

            useEffect(() => {
                if (deliveries.length > 0) {
                    const avgLat = deliveries.reduce((sum, d) => sum + d.latitude, 0) / deliveries.length;
                    const avgLng = deliveries.reduce((sum, d) => sum + d.longitude, 0) / deliveries.length;
                    setMapCenter({ lat: avgLat, lng: avgLng });
                }
            }, [deliveries]);

            useEffect(() => {
                if (autoMonitoring && allRoutes && deliveries.length > 0) {
                    checkConditionsAndReroute();
                    
                    monitoringIntervalRef.current = setInterval(() => {
                        checkConditionsAndReroute();
                    }, CONDITION_CHECK_INTERVAL * 1000);

                    countdownIntervalRef.current = setInterval(() => {
                        setCountdown(prev => {
                            if (prev <= 1) return CONDITION_CHECK_INTERVAL;
                            return prev - 1;
                        });
                    }, 1000);

                    return () => {
                        if (monitoringIntervalRef.current) clearInterval(monitoringIntervalRef.current);
                        if (countdownIntervalRef.current) clearInterval(countdownIntervalRef.current);
                    };
                } else {
                    if (monitoringIntervalRef.current) clearInterval(monitoringIntervalRef.current);
                    if (countdownIntervalRef.current) clearInterval(countdownIntervalRef.current);
                    setCountdown(CONDITION_CHECK_INTERVAL);
                }
            }, [autoMonitoring, allRoutes, deliveries]);

            const checkConditionsAndReroute = async () => {
                try {
                    const newConditions = {
                        weather: {
                            condition: Math.random() > 0.7 ? 'heavy_rain' : (Math.random() > 0.5 ? 'light_rain' : 'clear'),
                            temperature: 25 + Math.random() * 10,
                            humidity: 60 + Math.random() * 30
                        },
                        traffic: {
                            level: Math.random() > 0.7 ? 'high' : (Math.random() > 0.5 ? 'moderate' : 'low'),
                            ratio: 0.9 + Math.random() * 0.7
                        },
                        timestamp: new Date().toISOString()
                    };

                    setCurrentConditions(newConditions);

                    if (previousConditions) {
                        const weatherChanged = newConditions.weather.condition !== previousConditions.weather.condition;
                        const trafficChanged = newConditions.traffic.level !== previousConditions.traffic.level;

                        if (weatherChanged || trafficChanged) {
                            await performAutomaticRerouting(previousConditions, newConditions);
                        }
                    } else {
                        setPreviousConditions(newConditions);
                    }
                } catch (error) {
                    console.error('Error checking conditions:', error);
                }
            };

            const performAutomaticRerouting = async (oldConditions, newConditions) => {
                try {
                    setLoading(true);

                    const response = await fetch(`${API_BASE}/ml/change-conditions-realtime`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            zone_id: 1,
                            deliveries: deliveries.map(d => ({
                                address: d.address,
                                latitude: d.latitude,
                                longitude: d.longitude,
                                mail_type: d.mail_type,
                                priority: d.priority,
                                parcels: 1,
                                urgent: d.priority === 'urgent' ? 1 : 0
                            })),
                            original_traffic: oldConditions.traffic.level,
                            original_weather: oldConditions.weather.condition,
                            new_traffic: newConditions.traffic.level,
                            new_weather: newConditions.weather.condition,
                            optimization_method: 'q_learning'
                        })
                    });

                    if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);

                    const data = await response.json();
                    const timeChangePct = Math.abs(data.impact_analysis.time_change_pct);

                    if (timeChangePct > ROUTE_UPDATE_THRESHOLD) {
                        const originalRouteData = data.original_route.deliveries && data.original_route.deliveries.length > 0 
                            ? data.original_route.deliveries.slice(1) 
                            : deliveries;
                        const newRouteData = data.new_route.deliveries && data.new_route.deliveries.length > 0 
                            ? data.new_route.deliveries.slice(1) 
                            : deliveries;

                        setOriginalRouteForRerouting(originalRouteData);
                        setNewRouteForRerouting(newRouteData);
                        setCurrentRoute(data.new_route);
                        setImpactAnalysis(data.impact_analysis);

                        setReroutingAlert({
                            severity: data.impact_analysis.severity,
                            message: `🚨 Conditions Changed - Auto-Rerouting Applied!`,
                            changes: {
                                weather: `${oldConditions.weather.condition} → ${newConditions.weather.condition}`,
                                traffic: `${oldConditions.traffic.level} → ${newConditions.traffic.level}`,
                                timeChange: `${data.impact_analysis.time_change_minutes} min`,
                                distanceChange: `${data.impact_analysis.distance_change_km} km`
                            },
                            timestamp: new Date()
                        });

                        setReroutingHistory(prev => [{
                            timestamp: new Date(),
                            oldConditions,
                            newConditions,
                            impact: data.impact_analysis,
                            id: Date.now()
                        }, ...prev].slice(0, 10));

                        // Set view to autoRerouting after state is updated
                        setTimeout(() => {
                            setCurrentView('autoRerouting');
                        }, 100);
                        
                        setTimeout(() => setReroutingAlert(null), 10000);
                    }

                    setPreviousConditions(newConditions);
                } catch (error) {
                    console.error('Error during rerouting:', error);
                } finally {
                    setLoading(false);
                }
            };

            const fetchRealTimeConditions = async () => {
                if (deliveries.length === 0) return;
                
                setConditionsLoading(true);
                try {
                    setCurrentConditions({
                        weather: {
                            condition: 'clear',
                            temperature: 28,
                            humidity: 70,
                            description: 'clear sky',
                            rain_volume: 0
                        },
                        traffic: {
                            level: 'moderate',
                            ratio: 1.0
                        },
                        timestamp: new Date().toISOString()
                    });
                } catch (error) {
                    console.error('Error fetching conditions:', error);
                } finally {
                    setConditionsLoading(false);
                }
            };

            const classifyMail = async (mailData) => {
                try {
                    const response = await fetch(`${API_BASE}/ml/classify-priority`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            mail_type: mailData.mail_type,
                            sender_type: mailData.sender_type || 'Individual',
                            recipient_type: mailData.recipient_type || 'Individual',
                            time_received: new Date().toISOString(),
                            day_of_week: new Date().toLocaleDateString('en-US', { weekday: 'long' })
                        })
                    });
                    
                    if (response.ok) {
                        const result = await response.json();
                        return result.priority;
                    }
                } catch (error) {
                    console.error('Classification error:', error);
                }
                
                const urgentTypes = ['Court Notice', 'Legal Document', 'Registered Letter', 
                                    'Speed Post', 'Express Mail', 'Tax Document'];
                return urgentTypes.includes(mailData.mail_type) ? 'urgent' : 'regular';
            };

            const handleCSVUpload = async (event) => {
                const file = event.target.files[0];
                if (!file) return;

                setLoading(true);
                setError(null);
                setUploadProgress('Parsing CSV file...');

                Papa.parse(file, {
                    header: true,
                    skipEmptyLines: true,
                    complete: async (results) => {
                        try {
                            const processedDeliveries = [];
                            const totalRows = results.data.length;

                            for (let i = 0; i < results.data.length; i++) {
                                const row = results.data[i];
                                setUploadProgress(`Processing ${i + 1} of ${totalRows}: Geocoding ${row.address}...`);

                                let latitude = row.latitude ? parseFloat(row.latitude) : null;
                                let longitude = row.longitude ? parseFloat(row.longitude) : null;

                                if (!latitude || !longitude) {
                                    const coords = await geocodeAddress(row.address);
                                    latitude = coords.latitude;
                                    longitude = coords.longitude;
                                    
                                    if (coords.fallback) {
                                        console.warn(`Using fallback coordinates for: ${row.address}`);
                                    }
                                }

                                setUploadProgress(`Processing ${i + 1} of ${totalRows}: Classifying mail...`);
                                const priority = await classifyMail({
                                    mail_type: row.mail_type,
                                    sender_type: row.sender_type,
                                    recipient_type: row.recipient_type
                                });

                                processedDeliveries.push({
                                    id: i + 1,
                                    address: row.address,
                                    latitude: latitude,
                                    longitude: longitude,
                                    mail_type: row.mail_type,
                                    priority: priority,
                                    sender_type: row.sender_type || 'Individual',
                                    recipient_type: row.recipient_type || 'Individual'
                                });
                            }

                            setDeliveries(processedDeliveries);
                            setUploadProgress(null);
                            setLoading(false);
                            setError(null);
                            setCurrentView('mailList');
                            
                            setTimeout(() => fetchRealTimeConditions(), 500);
                            alert(`Successfully processed ${processedDeliveries.length} deliveries!`);
                        } catch (error) {
                            console.error('Error processing CSV:', error);
                            setError('Error processing CSV: ' + error.message);
                            setUploadProgress(null);
                            setLoading(false);
                        }
                    },
                    error: (error) => {
                        setError('Error parsing CSV: ' + error.message);
                        setUploadProgress(null);
                        setLoading(false);
                    }
                });

                event.target.value = '';
            };

            const optimizeRoutes = async () => {
                if (deliveries.length === 0) return;

                setLoading(true);
                setError(null);
                
                try {
                    const response = await fetch(`${API_BASE}/ml/optimize-route`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            zone_id: 1,
                            deliveries: deliveries.map(d => ({
                                address: d.address,
                                latitude: d.latitude,
                                longitude: d.longitude,
                                mail_type: d.mail_type,
                                priority: d.priority,
                                parcels: 1,
                                urgent: d.priority === 'urgent' ? 1 : 0
                            })),
                            methods: ['nearest_neighbor', 'urgent_priority', '2opt', 'q_learning']
                        })
                    });
                    
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    
                    const data = await response.json();
                    setAllRoutes(data);
                    setCurrentRoute(data.best_result);
                    
                    if (data.real_time_data) {
                        const initialConditions = {
                            weather: data.real_time_data.weather,
                            traffic: data.real_time_data.traffic,
                            timestamp: new Date().toISOString()
                        };
                        setCurrentConditions(initialConditions);
                        setPreviousConditions(initialConditions);
                    }
                    
                    setCurrentView('routes');
                } catch (error) {
                    console.error('Error optimizing route:', error);
                    setError('Error optimizing route: ' + error.message);
                } finally {
                    setLoading(false);
                }
            };

            const handleGeocodeNewAddress = async () => {
                if (!newAddress) return;

                setLoading(true);
                setError(null);

                try {
                    const coords = await geocodeAddress(newAddress);
                    
                    if (coords.success) {
                        setNewLatitude(coords.latitude.toString());
                        setNewLongitude(coords.longitude.toString());
                        setError(null);
                    } else if (coords.fallback) {
                        setNewLatitude(coords.latitude.toString());
                        setNewLongitude(coords.longitude.toString());
                        setError('⚠️ Address not found precisely. Using approximate coordinates.');
                    } else {
                        setError('Failed to geocode address. Please enter coordinates manually.');
                    }
                } catch (error) {
                    setError('Error geocoding address: ' + error.message);
                } finally {
                    setLoading(false);
                }
            };

            const compareRelocation = async () => {
                if (!allRoutes || !selectedDeliveryId || !newLatitude || !newLongitude) return;

                setLoading(true);
                setError(null);

                try {
                    const selectedDelivery = deliveries.find(d => d.id === selectedDeliveryId);
                    if (!selectedDelivery) throw new Error('Selected delivery not found');

                    const R = 6371;
                    const oldLat = selectedDelivery.latitude;
                    const oldLon = selectedDelivery.longitude;
                    const newLat = parseFloat(newLatitude);
                    const newLon = parseFloat(newLongitude);

                    const dLat = (newLat - oldLat) * Math.PI / 180;
                    const dLon = (newLon - oldLon) * Math.PI / 180;
                    const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                            Math.cos(oldLat * Math.PI / 180) * Math.cos(newLat * Math.PI / 180) *
                            Math.sin(dLon/2) * Math.sin(dLon/2);
                    const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
                    const distanceChange = (R * c).toFixed(2);

                    const updatedDeliveries = deliveries.map(d => 
                        d.id === selectedDeliveryId 
                            ? { ...d, latitude: newLat, longitude: newLon }
                            : d
                    );

                    const response = await fetch(`${API_BASE}/ml/optimize-route`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            zone_id: 1,
                            deliveries: updatedDeliveries.map(d => ({
                                address: d.address,
                                latitude: d.latitude,
                                longitude: d.longitude,
                                mail_type: d.mail_type,
                                priority: d.priority,
                                parcels: 1,
                                urgent: d.priority === 'urgent' ? 1 : 0
                            })),
                            methods: ['nearest_neighbor', 'urgent_priority', '2opt', 'q_learning']
                        })
                    });

                    if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);

                    const newRouteData = await response.json();
                    
                    setRelocationData({
                        location_id: selectedDeliveryId,
                        address: selectedDelivery.address,
                        new_address: newAddress,
                        old_latitude: oldLat,
                        old_longitude: oldLon,
                        new_latitude: newLat,
                        new_longitude: newLon,
                        distance_change_km: distanceChange
                    });

                    setRelocationRoutes({
                        original: allRoutes,
                        new: newRouteData,
                        updatedDeliveries: updatedDeliveries
                    });
                    
                    setCurrentView('relocation');
                } catch (error) {
                    console.error('Error comparing relocation:', error);
                    setError('Error comparing relocation: ' + error.message);
                } finally {
                    setLoading(false);
                }
            };

            const urgentCount = deliveries.filter(d => d.priority === 'urgent').length;
            const regularCount = deliveries.filter(d => d.priority === 'regular').length;

            const getTrafficIcon = (level) => {
                const icons = { low: '🟢', moderate: '🟡', high: '🔴', severe: '🔴' };
                return icons[level] || '🟡';
            };

            const getWeatherIcon = (condition) => {
                const icons = { clear: '☀️', light_rain: '🌦️', heavy_rain: '🌧️', flooding: '⛈️' };
                return icons[condition] || '☀️';
            };

            const getSeverityColor = (severity) => {
                const colors = {
                    'MINIMAL': 'bg-green-100 border-green-400 text-green-800',
                    'LOW': 'bg-blue-100 border-blue-400 text-blue-800',
                    'MEDIUM': 'bg-yellow-100 border-yellow-400 text-yellow-800',
                    'HIGH': 'bg-orange-100 border-orange-400 text-orange-800',
                    'CRITICAL': 'bg-red-100 border-red-400 text-red-800'
                };
                return colors[severity] || colors['MEDIUM'];
            };

            return (
                <div className="h-screen flex flex-col">
                    {/* Header */}
                    <div className="bg-gradient-to-r from-blue-600 to-indigo-700 text-white p-4 shadow-lg">
                        <div className="flex justify-between items-center">
                            <h1 className="text-2xl font-bold">🗺️ PRIORITY AWARE ROUTING OPTIMIZATION </h1>
                            {currentConditions && deliveries.length > 0 && (
                                <div className="flex gap-4 text-sm items-center">
                                    <div className="bg-white/20 px-4 py-2 rounded-lg">
                                        <span className="font-semibold">Traffic:</span> {getTrafficIcon(currentConditions.traffic.level)} {currentConditions.traffic.level}
                                    </div>
                                    <div className="bg-white/20 px-4 py-2 rounded-lg">
                                        <span className="font-semibold">Weather:</span> {getWeatherIcon(currentConditions.weather.condition)} {currentConditions.weather.condition}
                                    </div>
                                    <button
                                        onClick={fetchRealTimeConditions}
                                        disabled={conditionsLoading}
                                        className="bg-white/20 px-4 py-2 rounded-lg hover:bg-white/30 disabled:opacity-50"
                                    >
                                        {conditionsLoading ? '⏳' : '🔄'} Refresh
                                    </button>
                                    {autoMonitoring && (
                                        <div className="bg-green-500 px-4 py-2 rounded-lg flex items-center gap-2 animate-pulse">
                                            <span className="inline-block w-2 h-2 bg-white rounded-full"></span>
                                            <span className="font-bold">MONITORING</span>
                                            <span className="text-xs">({countdown}s)</span>
                                        </div>
                                    )}
                                </div>
                            )}
                        </div>
                    </div>

                    {/* Auto-Rerouting Alert */}
                    {reroutingAlert && (
                        <div className={`slide-in ${getSeverityColor(reroutingAlert.severity)} border-2 p-4 m-4 rounded-lg shadow-lg`}>
                            <div className="flex items-start justify-between">
                                <div className="flex-1">
                                    <div className="flex items-center gap-2 mb-2">
                                        <span className="text-2xl bounce">🚨</span>
                                        <strong className="text-lg">{reroutingAlert.message}</strong>
                                    </div>
                                    <div className="grid grid-cols-2 gap-4 text-sm mt-3">
                                        <div><strong>Weather:</strong> {reroutingAlert.changes.weather}</div>
                                        <div><strong>Traffic:</strong> {reroutingAlert.changes.traffic}</div>
                                        <div><strong>Time Impact:</strong> {reroutingAlert.changes.timeChange}</div>
                                        <div><strong>Distance Impact:</strong> {reroutingAlert.changes.distanceChange}</div>
                                    </div>
                                </div>
                                <button onClick={() => setReroutingAlert(null)} className="text-2xl hover:opacity-70 ml-4">×</button>
                            </div>
                        </div>
                    )}

                    <div className="flex-1 flex overflow-hidden">
                        {/* Left Sidebar */}
                        <div className="w-96 bg-gray-50 overflow-y-auto border-r shadow-lg">
                            <div className="p-4 space-y-4">
                                {error && (
                                    <div className="bg-red-100 border-2 border-red-400 text-red-700 px-4 py-3 rounded-lg">
                                        <strong>Error: </strong>{error}
                                    </div>
                                )}

                                {uploadProgress && (
                                    <div className="bg-blue-100 border-2 border-blue-400 text-blue-700 px-4 py-3 rounded-lg">
                                        <div className="flex items-center">
                                            <div className="animate-spin rounded-full h-5 w-5 border-b-2 border-blue-700 mr-3"></div>
                                            <span>{uploadProgress}</span>
                                        </div>
                                    </div>
                                )}

                                {/* CSV Upload */}
                                {currentView === 'upload' && (
                                    <div className="bg-white p-4 rounded-lg shadow">
                                        <label className="block text-sm font-bold mb-2">📄 Upload Mail CSV</label>
                                        <input
                                            ref={fileInputRef}
                                            type="file"
                                            accept=".csv"
                                            onChange={handleCSVUpload}
                                            disabled={loading}
                                            className="hidden"
                                        />
                                        <button
                                            onClick={() => fileInputRef.current.click()}
                                            disabled={loading}
                                            className="w-full bg-gradient-to-r from-purple-600 to-pink-600 text-white py-3 rounded-lg font-semibold hover:from-purple-700 hover:to-pink-700 disabled:from-gray-400 disabled:to-gray-500"
                                        >
                                            {loading ? '⏳ Processing...' : '📤 Upload CSV File'}
                                        </button>
                                    </div>
                                )}

                                {/* Real-time Conditions Display */}
                                {currentConditions && deliveries.length > 0 && (
                                    <div className="bg-gradient-to-br from-blue-50 to-indigo-50 p-4 rounded-lg shadow border-2 border-blue-200">
                                        <h3 className="font-bold mb-3 flex items-center">
                                            <span className="mr-2">🌍</span> 
                                            Real-Time Conditions
                                        </h3>
                                        
                                        <div className="space-y-3">
                                            <div className="bg-white p-3 rounded-lg">
                                                <div className="flex justify-between items-center mb-2">
                                                    <span className="font-semibold">Traffic Status</span>
                                                    <span className="text-2xl">{getTrafficIcon(currentConditions.traffic.level)}</span>
                                                </div>
                                                <div className="text-sm text-gray-600 space-y-1">
                                                    <div>Level: <span className="font-bold capitalize">{currentConditions.traffic.level}</span></div>
                                                    {currentConditions.traffic.ratio && (
                                                        <div>Ratio: <span className="font-bold">{currentConditions.traffic.ratio.toFixed(2)}</span></div>
                                                    )}
                                                </div>
                                            </div>

                                            <div className="bg-white p-3 rounded-lg">
                                                <div className="flex justify-between items-center mb-2">
                                                    <span className="font-semibold">Weather Conditions</span>
                                                    <span className="text-2xl">{getWeatherIcon(currentConditions.weather.condition)}</span>
                                                </div>
                                                <div className="text-sm text-gray-600 space-y-1">
                                                    <div>Condition: <span className="font-bold capitalize">{currentConditions.weather.condition.replace('_', ' ')}</span></div>
                                                    {currentConditions.weather.temperature && (
                                                        <div>Temperature: <span className="font-bold">{currentConditions.weather.temperature.toFixed(1)}°C</span></div>
                                                    )}
                                                    {currentConditions.weather.humidity && (
                                                        <div>Humidity: <span className="font-bold">{currentConditions.weather.humidity.toFixed(0)}%</span></div>
                                                    )}
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                )}

                                {/* Mail Statistics */}
                                {deliveries.length > 0 && (
                                    <div className="bg-white p-4 rounded-lg shadow">
                                        <h3 className="font-bold mb-3">📊 Mail Statistics</h3>
                                        <div className="space-y-2">
                                            <div className="flex justify-between p-2 bg-gray-50 rounded">
                                                <span className="text-sm font-semibold">Total:</span>
                                                <span className="font-bold text-blue-600">{deliveries.length}</span>
                                            </div>
                                            <div className="flex justify-between p-2 bg-red-50 rounded">
                                                <span className="text-sm font-semibold text-red-700">🔴 Urgent:</span>
                                                <span className="font-bold text-red-600">{urgentCount}</span>
                                            </div>
                                            <div className="flex justify-between p-2 bg-blue-50 rounded">
                                                <span className="text-sm font-semibold text-blue-700">🔵 Regular:</span>
                                                <span className="font-bold text-blue-600">{regularCount}</span>
                                            </div>
                                        </div>
                                    </div>
                                )}

                                {/* Legend for Rerouting */}
                                {currentView === 'autoRerouting' && (
                                    <div className="bg-gradient-to-br from-yellow-50 to-orange-50 p-4 rounded-lg shadow-lg border-2 border-yellow-300">
                                        <h3 className="font-bold mb-3">🗺️ Route Visualization Legend</h3>
                                        <div className="space-y-3 text-sm">
                                            <div className="flex items-center gap-2">
                                                <div className="w-8 h-1 bg-gray-400"></div>
                                                <span>Unchanged segment (both routes)</span>
                                            </div>
                                            <div className="flex items-center gap-2">
                                                <div className="w-8 h-1 bg-red-500" style={{backgroundImage: 'repeating-linear-gradient(90deg, #ef4444 0px, #ef4444 5px, transparent 5px, transparent 10px)'}}></div>
                                                <span>Original route (discarded)</span>
                                            </div>
                                            <div className="flex items-center gap-2">
                                                <div className="w-8 h-1 bg-green-500"></div>
                                                <span>New optimized route (with arrows)</span>
                                            </div>
                                            <div className="flex items-center gap-2">
                                                <div className="w-4 h-4 rounded-full bg-yellow-400 border-2 border-white"></div>
                                                <span>Divergence point (⚠️ where it changes)</span>
                                            </div>
                                        </div>
                                    </div>
                                )}

                                {/* View Mail List Button */}
                                {deliveries.length > 0 && currentView !== 'mailList' && currentView !== 'upload' && (
                                    <button
                                        onClick={() => setCurrentView('mailList')}
                                        className="w-full bg-gradient-to-r from-indigo-500 to-purple-600 text-white py-3 rounded-lg font-semibold hover:from-indigo-600 hover:to-purple-700"
                                    >
                                        📋 View All Mail
                                    </button>
                                )}

                                {/* Optimize Button */}
                                {deliveries.length > 0 && currentView === 'mailList' && (
                                    <button
                                        onClick={optimizeRoutes}
                                        disabled={loading}
                                        className="w-full bg-gradient-to-r from-blue-600 to-indigo-600 text-white py-4 rounded-lg font-bold text-lg hover:from-blue-700 hover:to-indigo-700 disabled:from-gray-400 disabled:to-gray-500"
                                    >
                                        {loading ? '⏳ Optimizing...' : '🚀 Optimize Routes'}
                                    </button>
                                )}

                                {/* Auto-Monitoring Toggle */}
                                {allRoutes && currentView === 'routes' && (
                                    <div className="bg-gradient-to-br from-green-50 to-emerald-50 p-4 rounded-lg shadow-lg border-2 border-green-300">
                                        <h3 className="font-bold mb-3 flex items-center">
                                            <span className="mr-2">🤖</span>
                                            Auto-Monitoring System
                                        </h3>
                                        <button
                                            onClick={() => setAutoMonitoring(!autoMonitoring)}
                                            className={`w-full py-3 rounded-lg font-bold text-lg transition-all shadow ${
                                                autoMonitoring 
                                                    ? 'bg-red-500 hover:bg-red-600 text-white' 
                                                    : 'bg-green-500 hover:bg-green-600 text-white'
                                            }`}
                                        >
                                            {autoMonitoring ? '⏸️ Stop Monitoring' : '▶️ Start Monitoring'}
                                        </button>
                                        <div className="mt-3 text-xs text-gray-600 bg-white p-2 rounded">
                                            <p className="mb-1">• Checks every {CONDITION_CHECK_INTERVAL}s</p>
                                            <p className="mb-1">• Auto-reroutes when impact &gt; {ROUTE_UPDATE_THRESHOLD}%</p>
                                            <p>• Shows divergence points clearly</p>
                                        </div>
                                    </div>
                                )}

                                {/* Current Route Info */}
                                {currentRoute && (currentView === 'routes' || currentView === 'autoRerouting') && (
                                    <div className="bg-white p-4 rounded-lg shadow">
                                        <h3 className="font-bold mb-3">📍 Current Route</h3>
                                        <div className="space-y-2 text-sm">
                                            <div className="flex justify-between">
                                                <span>Distance:</span>
                                                <strong>{currentRoute.distance_km} km</strong>
                                            </div>
                                            <div className="flex justify-between">
                                                <span>Time:</span>
                                                <strong>{currentRoute.time_minutes} min</strong>
                                            </div>
                                            <div className="flex justify-between">
                                                <span>Urgent Success:</span>
                                                <strong>{currentRoute.urgent_on_time}%</strong>
                                            </div>
                                        </div>
                                    </div>
                                )}

                                {/* Impact Analysis */}
                                {impactAnalysis && currentView === 'autoRerouting' && (
                                    <div className={`p-4 rounded-lg shadow-lg border-2 ${getSeverityColor(impactAnalysis.severity)}`}>
                                        <h3 className="font-bold mb-3">📊 Rerouting Impact</h3>
                                        <div className="space-y-2 text-sm">
                                            <div>
                                                <strong>Severity:</strong>
                                                <span className="ml-2 font-bold">{impactAnalysis.severity}</span>
                                            </div>
                                            <div>
                                                <strong>Time Change:</strong>
                                                <span className={`ml-2 font-bold ${impactAnalysis.time_change_minutes > 0 ? 'text-red-600' : 'text-green-600'}`}>
                                                    {impactAnalysis.time_change_minutes > 0 ? '+' : ''}{impactAnalysis.time_change_minutes} min
                                                </span>
                                            </div>
                                            <div>
                                                <strong>Distance Change:</strong>
                                                <span className={`ml-2 font-bold ${impactAnalysis.distance_change_km > 0 ? 'text-red-600' : 'text-green-600'}`}>
                                                    {impactAnalysis.distance_change_km > 0 ? '+' : ''}{impactAnalysis.distance_change_km} km
                                                </span>
                                            </div>
                                        </div>
                                    </div>
                                )}

                                {/* Rerouting History */}
                                {reroutingHistory.length > 0 && (
                                    <div className="bg-white p-4 rounded-lg shadow">
                                        <h3 className="font-bold mb-3">📜 Rerouting History</h3>
                                        <div className="space-y-2 max-h-64 overflow-y-auto">
                                            {reroutingHistory.map(entry => (
                                                <div key={entry.id} className="text-xs border-l-4 border-blue-500 pl-2 py-1 bg-gray-50">
                                                    <div className="font-semibold">{new Date(entry.timestamp).toLocaleTimeString()}</div>
                                                    <div className="text-gray-600">
                                                        {entry.oldConditions.weather.condition} → {entry.newConditions.weather.condition}
                                                    </div>
