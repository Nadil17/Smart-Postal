<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Postal Route Optimization System</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .map-container { height: 100%; width: 100%; }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .pulse { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const API_BASE = 'http://localhost:8000/api';
        const GOOGLE_MAPS_API_KEY = 'AIzaSyB_996Uyid5qMajR-4PJY0EcpO6Prp_n4c';

        // Default center - Colombo, Sri Lanka
        const DEFAULT_CENTER = { lat: 6.9271, lng: 79.8612 };

        // Load Google Maps API
        const loadGoogleMapsScript = () => {
            return new Promise((resolve, reject) => {
                if (window.google && window.google.maps) {
                    resolve();
                    return;
                }

                const script = document.createElement('script');
                script.src = `https://maps.googleapis.com/maps/api/js?key=${GOOGLE_MAPS_API_KEY}&libraries=geometry`;
                script.async = true;
                script.defer = true;
                script.onload = resolve;
                script.onerror = reject;
                document.head.appendChild(script);
            });
        };

        const geocodeAddress = async (address) => {
            try {
                await new Promise(resolve => setTimeout(resolve, 1000));
                
                const response = await fetch(
                    `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(address + ', Sri Lanka')}&limit=1`,
                    { headers: { 'User-Agent': 'PostalRouteOptimization/1.0' } }
                );
                const data = await response.json();
                
                if (data && data.length > 0) {
                    return {
                        latitude: parseFloat(data[0].lat),
                        longitude: parseFloat(data[0].lon),
                        success: true
                    };
                }
                
                return {
                    latitude: DEFAULT_CENTER.lat + (Math.random() - 0.5) * 0.1,
                    longitude: DEFAULT_CENTER.lng + (Math.random() - 0.5) * 0.1,
                    success: false,
                    fallback: true
                };
            } catch (error) {
                console.error('Geocoding error:', error);
                return {
                    latitude: DEFAULT_CENTER.lat + (Math.random() - 0.5) * 0.1,
                    longitude: DEFAULT_CENTER.lng + (Math.random() - 0.5) * 0.1,
                    success: false,
                    fallback: true
                };
            }
        };

        const MapView = ({ deliveries, route, center, zoom = 13, showRoute = false, 
                          comparisonMode = false, baselineRoute = null, optimalRoute = null,
                          showLabels = true, relocationMode = false, relocationData = null,
                          beforeDeliveries = null, afterDeliveries = null }) => {
            const mapRef = useRef(null);
            const mapInstanceRef = useRef(null);
            const markersRef = useRef([]);
            const polylinesRef = useRef([]);

            useEffect(() => {
                loadGoogleMapsScript().then(() => {
                    if (!mapRef.current || mapInstanceRef.current) return;

                    const map = new google.maps.Map(mapRef.current, {
                        center: { lat: center.lat, lng: center.lng },
                        zoom: zoom,
                        mapTypeControl: true,
                        streetViewControl: true,
                        fullscreenControl: true,
                        zoomControl: true
                    });

                    mapInstanceRef.current = map;
                }).catch(err => console.error('Failed to load Google Maps:', err));

                return () => {
                    markersRef.current.forEach(marker => marker.setMap(null));
                    polylinesRef.current.forEach(polyline => polyline.setMap(null));
                    markersRef.current = [];
                    polylinesRef.current = [];
                };
            }, []);

            useEffect(() => {
                if (!mapInstanceRef.current || !deliveries || !window.google) return;

                const map = mapInstanceRef.current;
                
                // Clear existing markers and polylines
                markersRef.current.forEach(marker => marker.setMap(null));
                polylinesRef.current.forEach(polyline => polyline.setMap(null));
                markersRef.current = [];
                polylinesRef.current = [];

                // Relocation mode
                if (relocationMode && relocationData && baselineRoute && optimalRoute) {
                    // Draw before route (blue dashed)
                    const beforePath = baselineRoute.map(d => ({ lat: d.latitude, lng: d.longitude }));
                    const beforePolyline = new google.maps.Polyline({
                        path: beforePath,
                        geodesic: true,
                        strokeColor: '#3b82f6',
                        strokeOpacity: 0.6,
                        strokeWeight: 5,
                        icons: [{
                            icon: { path: 'M 0,-1 0,1', strokeOpacity: 1, scale: 4 },
                            offset: '0',
                            repeat: '20px'
                        }]
                    });
                    beforePolyline.setMap(map);
                    polylinesRef.current.push(beforePolyline);

                    // Draw after route (green solid)
                    const afterPath = optimalRoute.map(d => ({ lat: d.latitude, lng: d.longitude }));
                    const afterPolyline = new google.maps.Polyline({
                        path: afterPath,
                        geodesic: true,
                        strokeColor: '#10b981',
                        strokeOpacity: 0.9,
                        strokeWeight: 5
                    });
                    afterPolyline.setMap(map);
                    polylinesRef.current.push(afterPolyline);

                    // Mark old location
                    const oldMarker = new google.maps.Marker({
                        position: { lat: relocationData.old_latitude, lng: relocationData.old_longitude },
                        map: map,
                        icon: {
                            path: google.maps.SymbolPath.CIRCLE,
                            scale: 20,
                            fillColor: '#9ca3af',
                            fillOpacity: 1,
                            strokeColor: '#ffffff',
                            strokeWeight: 3
                        },
                        title: 'Old Location'
                    });

                    const oldInfoWindow = new google.maps.InfoWindow({
                        content: `
                            <div style="min-width: 200px; padding: 10px;">
                                <strong style="font-size: 14px; color: #9ca3af;">📍 OLD LOCATION</strong><br>
                                <div style="margin-top: 8px; font-size: 12px;">
                                    <strong>Address:</strong><br>${relocationData.address.substring(0, 50)}...<br>
                                    <strong>Coordinates:</strong><br>
                                    ${relocationData.old_latitude.toFixed(4)}, ${relocationData.old_longitude.toFixed(4)}
                                </div>
                            </div>
                        `
                    });

                    oldMarker.addListener('click', () => oldInfoWindow.open(map, oldMarker));
                    markersRef.current.push(oldMarker);

                    // Mark new location
                    const newMarker = new google.maps.Marker({
                        position: { lat: relocationData.new_latitude, lng: relocationData.new_longitude },
                        map: map,
                        icon: {
                            path: google.maps.SymbolPath.CIRCLE,
                            scale: 24,
                            fillColor: '#f59e0b',
                            fillOpacity: 1,
                            strokeColor: '#ffffff',
                            strokeWeight: 4
                        },
                        title: 'New Location',
                        animation: google.maps.Animation.BOUNCE
                    });

                    const newInfoWindow = new google.maps.InfoWindow({
                        content: `
                            <div style="min-width: 220px; padding: 10px;">
                                <strong style="font-size: 16px; color: #f59e0b;">📍 NEW LOCATION</strong><br>
                                <div style="margin-top: 8px;">
                                    <strong>New Address:</strong><br>${relocationData.new_address || 'Custom Coordinates'}<br>
                                    <strong>Coordinates:</strong><br>
                                    ${relocationData.new_latitude.toFixed(4)}, ${relocationData.new_longitude.toFixed(4)}<br>
                                    <strong style="color: #ef4444;">Distance Moved:</strong> ${relocationData.distance_change_km} km
                                </div>
                            </div>
                        `
                    });

                    newMarker.addListener('click', () => newInfoWindow.open(map, newMarker));
                    markersRef.current.push(newMarker);

                    // Draw relocation path
                    const relocationPath = new google.maps.Polyline({
                        path: [
                            { lat: relocationData.old_latitude, lng: relocationData.old_longitude },
                            { lat: relocationData.new_latitude, lng: relocationData.new_longitude }
                        ],
                        geodesic: true,
                        strokeColor: '#f59e0b',
                        strokeOpacity: 0.8,
                        strokeWeight: 4,
                        icons: [{
                            icon: { path: 'M 0,-1 0,1', strokeOpacity: 1, scale: 4 },
                            offset: '0',
                            repeat: '20px'
                        }]
                    });
                    relocationPath.setMap(map);
                    polylinesRef.current.push(relocationPath);

                    // Add other delivery markers
                    const displayDeliveries = afterDeliveries || deliveries;
                    displayDeliveries.forEach((delivery, index) => {
                        if (delivery.id === relocationData.location_id) return;
                        
                        const isUrgent = delivery.priority === 'urgent';
                        
                        const marker = new google.maps.Marker({
                            position: { lat: delivery.latitude, lng: delivery.longitude },
                            map: map,
                            icon: {
                                path: google.maps.SymbolPath.CIRCLE,
                                scale: 14,
                                fillColor: isUrgent ? '#ef4444' : '#3b82f6',
                                fillOpacity: 1,
                                strokeColor: '#ffffff',
                                strokeWeight: 2
                            },
                            title: delivery.address
                        });

                        const infoWindow = new google.maps.InfoWindow({
                            content: `
                                <div style="min-width: 200px; padding: 10px;">
                                    <strong style="font-size: 14px;">${delivery.address}</strong><br>
                                    <div style="margin-top: 8px;">
                                        <strong>Priority:</strong> <span style="color: ${isUrgent ? '#ef4444' : '#3b82f6'}; font-weight: bold;">${(delivery.priority || 'regular').toUpperCase()}</span>
                                    </div>
                                </div>
                            `
                        });

                        marker.addListener('click', () => infoWindow.open(map, marker));
                        markersRef.current.push(marker);
                    });

                    // Fit bounds
                    const bounds = new google.maps.LatLngBounds();
                    displayDeliveries.forEach(d => bounds.extend({ lat: d.latitude, lng: d.longitude }));
                    bounds.extend({ lat: relocationData.old_latitude, lng: relocationData.old_longitude });
                    bounds.extend({ lat: relocationData.new_latitude, lng: relocationData.new_longitude });
                    map.fitBounds(bounds);

                    return;
                }

                // Comparison mode
                if (comparisonMode && baselineRoute && optimalRoute) {
                    // Draw baseline route (blue dashed)
                    const baselinePath = baselineRoute.map(d => ({ lat: d.latitude, lng: d.longitude }));
                    const baselinePolyline = new google.maps.Polyline({
                        path: baselinePath,
                        geodesic: true,
                        strokeColor: '#3b82f6',
                        strokeOpacity: 0.6,
                        strokeWeight: 5,
                        icons: [{
                            icon: { path: 'M 0,-1 0,1', strokeOpacity: 1, scale: 4 },
                            offset: '0',
                            repeat: '20px'
                        }]
                    });
                    baselinePolyline.setMap(map);
                    polylinesRef.current.push(baselinePolyline);

                    // Draw optimal route (green solid)
                    const optimalPath = optimalRoute.map(d => ({ lat: d.latitude, lng: d.longitude }));
                    const optimalPolyline = new google.maps.Polyline({
                        path: optimalPath,
                        geodesic: true,
                        strokeColor: '#10b981',
                        strokeOpacity: 0.9,
                        strokeWeight: 5
                    });
                    optimalPolyline.setMap(map);
                    polylinesRef.current.push(optimalPolyline);
                }

                // Standard route display
                deliveries.forEach((delivery, index) => {
                    const isUrgent = delivery.priority === 'urgent';
                    
                    const marker = new google.maps.Marker({
                        position: { lat: delivery.latitude, lng: delivery.longitude },
                        map: map,
                        icon: {
                            path: google.maps.SymbolPath.CIRCLE,
                            scale: 16,
                            fillColor: isUrgent ? '#ef4444' : '#3b82f6',
                            fillOpacity: 1,
                            strokeColor: '#ffffff',
                            strokeWeight: 3
                        },
                        label: showLabels ? {
                            text: `${index + 1}`,
                            color: '#ffffff',
                            fontSize: '12px',
                            fontWeight: 'bold'
                        } : null,
                        title: delivery.address
                    });

                    const infoWindow = new google.maps.InfoWindow({
                        content: `
                            <div style="min-width: 220px; padding: 10px;">
                                <strong style="font-size: 15px;">${delivery.address}</strong><br>
                                <div style="margin-top: 10px; padding-top: 8px; border-top: 1px solid #e5e7eb;">
                                    <div style="margin-bottom: 4px;"><strong>Mail Type:</strong> ${delivery.mail_type || 'N/A'}</div>
                                    <div style="margin-bottom: 4px;"><strong>Priority:</strong> <span style="color: ${isUrgent ? '#ef4444' : '#3b82f6'}; font-weight: bold;">${(delivery.priority || 'regular').toUpperCase()}</span></div>
                                    ${showLabels ? `<div><strong>Sequence:</strong> #${index + 1}</div>` : ''}
                                </div>
                            </div>
                        `
                    });

                    marker.addListener('click', () => infoWindow.open(map, marker));
                    markersRef.current.push(marker);
                });

                // Draw single route if not in comparison mode
                if (showRoute && route && route.length > 0 && !comparisonMode) {
                    const routePath = route.map(d => ({ lat: d.latitude, lng: d.longitude }));
                    const routePolyline = new google.maps.Polyline({
                        path: routePath,
                        geodesic: true,
                        strokeColor: '#10b981',
                        strokeOpacity: 0.8,
                        strokeWeight: 5
                    });
                    routePolyline.setMap(map);
                    polylinesRef.current.push(routePolyline);
                }

                // Add depot marker
                const depotMarker = new google.maps.Marker({
                    position: { lat: center.lat, lng: center.lng },
                    map: map,
                    icon: {
                        path: google.maps.SymbolPath.CIRCLE,
                        scale: 20,
                        fillColor: '#10b981',
                        fillOpacity: 1,
                        strokeColor: '#ffffff',
                        strokeWeight: 3
                    },
                    label: {
                        text: '🏢',
                        fontSize: '20px'
                    },
                    title: 'Postal Depot'
                });

                const depotInfoWindow = new google.maps.InfoWindow({
                    content: '<strong>Postal Depot (Start/End)</strong>'
                });

                depotMarker.addListener('click', () => depotInfoWindow.open(map, depotMarker));
                markersRef.current.push(depotMarker);

                // Fit bounds to show all markers
                if (deliveries.length > 0) {
                    const bounds = new google.maps.LatLngBounds();
                    deliveries.forEach(d => bounds.extend({ lat: d.latitude, lng: d.longitude }));
                    bounds.extend({ lat: center.lat, lng: center.lng });
                    map.fitBounds(bounds);
                }
            }, [deliveries, route, showRoute, comparisonMode, baselineRoute, optimalRoute, showLabels, relocationMode, relocationData, afterDeliveries]);

            return <div ref={mapRef} className="map-container" />;
        };

        const App = () => {
            const [deliveries, setDeliveries] = useState([]);
            const [allRoutes, setAllRoutes] = useState(null);
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState(null);
            const [uploadProgress, setUploadProgress] = useState(null);
            const fileInputRef = useRef(null);

            // View state
            const [currentView, setCurrentView] = useState('upload');

            // Real-time conditions
            const [currentConditions, setCurrentConditions] = useState(null);
            const [conditionsLoading, setConditionsLoading] = useState(false);
            
            // Relocation state
            const [selectedDeliveryId, setSelectedDeliveryId] = useState(null);
            const [newAddress, setNewAddress] = useState('');
            const [newLatitude, setNewLatitude] = useState('');
            const [newLongitude, setNewLongitude] = useState('');
            const [relocationData, setRelocationData] = useState(null);
            const [relocationRoutes, setRelocationRoutes] = useState(null);

            // Calculate center from deliveries
            const [mapCenter, setMapCenter] = useState(DEFAULT_CENTER);

            useEffect(() => {
                loadGoogleMapsScript();
            }, []);

            useEffect(() => {
                if (deliveries.length > 0) {
                    const avgLat = deliveries.reduce((sum, d) => sum + d.latitude, 0) / deliveries.length;
                    const avgLng = deliveries.reduce((sum, d) => sum + d.longitude, 0) / deliveries.length;
                    setMapCenter({ lat: avgLat, lng: avgLng });
                }
            }, [deliveries]);

            const fetchRealTimeConditions = async () => {
                if (deliveries.length === 0) return;
                
                setConditionsLoading(true);
                try {
                    const avgLat = deliveries.reduce((sum, d) => sum + d.latitude, 0) / deliveries.length;
                    const avgLng = deliveries.reduce((sum, d) => sum + d.longitude, 0) / deliveries.length;

                    // Mock weather and traffic data
                    setCurrentConditions({
                        weather: {
                            condition: 'clear',
                            temperature: 28,
                            humidity: 70,
                            description: 'clear sky',
                            rain_volume: 0
                        },
                        traffic: {
                            level: 'moderate',
                            ratio: 1.0
                        },
                        timestamp: new Date().toISOString()
                    });
                } catch (error) {
                    console.error('Error fetching conditions:', error);
                } finally {
                    setConditionsLoading(false);
                }
            };

            const classifyMail = async (mailData) => {
                try {
                    const response = await fetch(`${API_BASE}/ml/classify-priority`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            mail_type: mailData.mail_type,
                            sender_type: mailData.sender_type || 'Individual',
                            recipient_type: mailData.recipient_type || 'Individual',
                            time_received: new Date().toISOString(),
                            day_of_week: new Date().toLocaleDateString('en-US', { weekday: 'long' })
                        })
                    });
                    
                    if (response.ok) {
                        const result = await response.json();
                        return result.priority;
                    }
                } catch (error) {
                    console.error('Classification error:', error);
                }
                
                const urgentTypes = ['Court Notice', 'Legal Document', 'Registered Letter', 
                                    'Speed Post', 'Express Mail', 'Tax Document'];
                return urgentTypes.includes(mailData.mail_type) ? 'urgent' : 'regular';
            };

            const handleCSVUpload = async (event) => {
                const file = event.target.files[0];
                if (!file) return;

                setLoading(true);
                setError(null);
                setUploadProgress('Parsing CSV file...');

                Papa.parse(file, {
                    header: true,
                    skipEmptyLines: true,
                    complete: async (results) => {
                        try {
                            const processedDeliveries = [];
                            const totalRows = results.data.length;

                            for (let i = 0; i < results.data.length; i++) {
                                const row = results.data[i];
                                setUploadProgress(`Processing ${i + 1} of ${totalRows}: Geocoding ${row.address}...`);

                                let latitude = row.latitude ? parseFloat(row.latitude) : null;
                                let longitude = row.longitude ? parseFloat(row.longitude) : null;

                                if (!latitude || !longitude) {
                                    const coords = await geocodeAddress(row.address);
                                    latitude = coords.latitude;
                                    longitude = coords.longitude;
                                    
                                    if (coords.fallback) {
                                        console.warn(`Using fallback coordinates for: ${row.address}`);
                                    }
                                }

                                setUploadProgress(`Processing ${i + 1} of ${totalRows}: Classifying mail...`);
                                const priority = await classifyMail({
                                    mail_type: row.mail_type,
                                    sender_type: row.sender_type,
                                    recipient_type: row.recipient_type
                                });

                                processedDeliveries.push({
                                    id: i + 1,
                                    address: row.address,
                                    latitude: latitude,
                                    longitude: longitude,
                                    mail_type: row.mail_type,
                                    priority: priority,
                                    sender_type: row.sender_type || 'Individual',
                                    recipient_type: row.recipient_type || 'Individual'
                                });
                            }

                            setDeliveries(processedDeliveries);
                            setUploadProgress(null);
                            setLoading(false);
                            setError(null);
                            setCurrentView('mailList');
                            
                            // Fetch conditions after upload
                            setTimeout(() => fetchRealTimeConditions(), 500);
                            
                            alert(`Successfully processed ${processedDeliveries.length} deliveries!`);
                        } catch (error) {
                            console.error('Error processing CSV:', error);
                            setError('Error processing CSV: ' + error.message);
                            setUploadProgress(null);
                            setLoading(false);
                        }
                    },
                    error: (error) => {
                        setError('Error parsing CSV: ' + error.message);
                        setUploadProgress(null);
                        setLoading(false);
                    }
                });

                event.target.value = '';
            };

            const optimizeRoutes = async () => {
                if (deliveries.length === 0) return;

                setLoading(true);
                setError(null);
                
                try {
                    const response = await fetch(`${API_BASE}/ml/optimize-route`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            zone_id: 1,
                            deliveries: deliveries.map(d => ({
                                address: d.address,
                                latitude: d.latitude,
                                longitude: d.longitude,
                                mail_type: d.mail_type,
                                priority: d.priority,
                                parcels: 1,
                                urgent: d.priority === 'urgent' ? 1 : 0
                            })),
                            methods: ['nearest_neighbor', 'urgent_priority', '2opt', 'q_learning']
                        })
                    });
                    
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    
                    const data = await response.json();
                    setAllRoutes(data);
                    
                    // Update conditions if returned
                    if (data.real_time_data) {
                        setCurrentConditions(prev => ({
                            ...prev,
                            weather: data.real_time_data.weather,
                            traffic: data.real_time_data.traffic
                        }));
                    }
                    
                    setCurrentView('routes');
                } catch (error) {
                    console.error('Error optimizing route:', error);
                    setError('Error optimizing route: ' + error.message);
                } finally {
                    setLoading(false);
                }
            };

            const handleGeocodeNewAddress = async () => {
                if (!newAddress) return;

                setLoading(true);
                setError(null);

                try {
                    const coords = await geocodeAddress(newAddress);
                    
                    if (coords.success) {
                        setNewLatitude(coords.latitude.toString());
                        setNewLongitude(coords.longitude.toString());
                        setError(null);
                    } else if (coords.fallback) {
                        setNewLatitude(coords.latitude.toString());
                        setNewLongitude(coords.longitude.toString());
                        setError('⚠️ Address not found precisely. Using approximate coordinates. Please adjust manually if needed.');
                    } else {
                        setError('Failed to geocode address. Please enter coordinates manually.');
                    }
                } catch (error) {
                    console.error('Geocoding error:', error);
                    setError('Error geocoding address: ' + error.message);
                } finally {
                    setLoading(false);
                }
            };

            const compareRelocation = async () => {
                if (!allRoutes || !selectedDeliveryId || !newLatitude || !newLongitude) return;

                setLoading(true);
                setError(null);

                try {
                    const selectedDelivery = deliveries.find(d => d.id === selectedDeliveryId);
                    if (!selectedDelivery) {
                        throw new Error('Selected delivery not found');
                    }

                    const R = 6371;
                    const oldLat = selectedDelivery.latitude;
                    const oldLon = selectedDelivery.longitude;
                    const newLat = parseFloat(newLatitude);
                    const newLon = parseFloat(newLongitude);

                    const dLat = (newLat - oldLat) * Math.PI / 180;
                    const dLon = (newLon - oldLon) * Math.PI / 180;
                    const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                            Math.cos(oldLat * Math.PI / 180) * Math.cos(newLat * Math.PI / 180) *
                            Math.sin(dLon/2) * Math.sin(dLon/2);
                    const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
                    const distanceChange = (R * c).toFixed(2);

                    const updatedDeliveries = deliveries.map(d => 
                        d.id === selectedDeliveryId 
                            ? { ...d, latitude: newLat, longitude: newLon }
                            : d
                    );

                    const response = await fetch(`${API_BASE}/ml/optimize-route`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            zone_id: 1,
                            deliveries: updatedDeliveries.map(d => ({
                                address: d.address,
                                latitude: d.latitude,
                                longitude: d.longitude,
                                mail_type: d.mail_type,
                                priority: d.priority,
                                parcels: 1,
                                urgent: d.priority === 'urgent' ? 1 : 0
                            })),
                            methods: ['nearest_neighbor', 'urgent_priority', '2opt', 'q_learning']
                        })
                    });

                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }

                    const newRouteData = await response.json();
                    
                    setRelocationData({
                        location_id: selectedDeliveryId,
                        address: selectedDelivery.address,
                        new_address: newAddress,
                        old_latitude: oldLat,
                        old_longitude: oldLon,
                        new_latitude: newLat,
                        new_longitude: newLon,
                        distance_change_km: distanceChange
                    });

                    setRelocationRoutes({
                        original: allRoutes,
                        new: newRouteData,
                        updatedDeliveries: updatedDeliveries
                    });
                    
                    setCurrentView('relocation');
                } catch (error) {
                    console.error('Error comparing relocation:', error);
                    setError('Error comparing relocation: ' + error.message);
                } finally {
                    setLoading(false);
                }
            };

            const urgentCount = deliveries.filter(d => d.priority === 'urgent').length;
            const regularCount = deliveries.filter(d => d.priority === 'regular').length;

            const getTrafficIcon = (level) => {
                const icons = { low: '🟢', moderate: '🟡', high: '🟠', severe: '🔴' };
                return icons[level] || '🟡';
            };

            const getWeatherIcon = (condition) => {
                const icons = { clear: '☀️', light_rain: '🌦️', heavy_rain: '🌧️', flooding: '⛈️' };
                return icons[condition] || '☀️';
            };

            return (
                <div className="h-screen flex flex-col">
                    <div className="bg-gradient-to-r from-blue-600 to-indigo-700 text-white p-4 shadow-lg">
                        <div className="flex justify-between items-center">
                            <h1 className="text-2xl font-bold">🗺️ Postal Route Optimization System</h1>
                            {currentConditions && deliveries.length > 0 && (
                                <div className="flex gap-4 text-sm">
                                    <div className="bg-white/20 px-4 py-2 rounded-lg">
                                        <span className="font-semibold">Traffic:</span> {getTrafficIcon(currentConditions.traffic.level)} {currentConditions.traffic.level}
                                    </div>
                                    <div className="bg-white/20 px-4 py-2 rounded-lg">
                                        <span className="font-semibold">Weather:</span> {getWeatherIcon(currentConditions.weather.condition)} {currentConditions.weather.description}
                                    </div>
                                    <button
                                        onClick={fetchRealTimeConditions}
                                        disabled={conditionsLoading}
                                        className="bg-white/20 px-4 py-2 rounded-lg hover:bg-white/30 transition-all disabled:opacity-50"
                                    >
                                        {conditionsLoading ? '⏳' : '🔄'} Refresh
                                    </button>
                                </div>
                            )}
                        </div>
                    </div>

                    <div className="flex-1 flex overflow-hidden">
                        {/* Left Sidebar */}
                        <div className="w-96 bg-gray-50 overflow-y-auto border-r shadow-lg">
                            <div className="p-4 space-y-4">
                                {error && (
                                    <div className="bg-red-100 border-2 border-red-400 text-red-700 px-4 py-3 rounded-lg">
                                        <strong className="font-bold">Error: </strong>
                                        <span className="block sm:inline">{error}</span>
                                    </div>
                                )}

                                {uploadProgress && (
                                    <div className="bg-blue-100 border-2 border-blue-400 text-blue-700 px-4 py-3 rounded-lg">
                                        <div className="flex items-center">
                                            <div className="animate-spin rounded-full h-5 w-5 border-b-2 border-blue-700 mr-3"></div>
                                            <span className="font-semibold">{uploadProgress}</span>
                                        </div>
                                    </div>
                                )}

                                {/* CSV Upload */}
                                {currentView === 'upload' && (
                                    <div className="bg-white p-4 rounded-lg shadow">
                                        <label className="block text-sm font-bold mb-2 text-gray-700">
                                            📄 Upload Mail CSV
                                        </label>
                                        <input
                                            ref={fileInputRef}
                                            type="file"
                                            accept=".csv"
                                            onChange={handleCSVUpload}
                                            disabled={loading}
                                            className="hidden"
                                        />
                                        <button
                                            onClick={() => fileInputRef.current.click()}
                                            disabled={loading}
                                            className="w-full bg-gradient-to-r from-purple-600 to-pink-600 text-white py-3 rounded-lg font-semibold hover:from-purple-700 hover:to-pink-700 disabled:from-gray-400 disabled:to-gray-500 transition-all shadow"
                                        >
                                            {loading ? '⏳ Processing...' : '📤 Upload CSV File'}
                                        </button>
                                        <div className="mt-3 text-xs text-gray-500 bg-gray-100 p-3 rounded">
                                            <p className="font-semibold mb-2">Required CSV columns:</p>
                                            <ul className="list-disc list-inside space-y-1">
                                                <li>address</li>
                                                <li>mail_type</li>
                                                <li>latitude (optional)</li>
                                                <li>longitude (optional)</li>
                                            </ul>
                                        </div>
                                    </div>
                                )}

                                {/* Real-time Conditions Display */}
                                {currentConditions && deliveries.length > 0 && (
                                    <div className="bg-gradient-to-br from-blue-50 to-indigo-50 p-4 rounded-lg shadow border-2 border-blue-200">
                                        <h3 className="font-bold mb-3 text-gray-800 flex items-center">
                                            <span className="mr-2">🌍</span> 
                                            Real-Time Conditions
                                        </h3>
                                        
                                        <div className="space-y-3">
                                            <div className="bg-white p-3 rounded-lg">
                                                <div className="flex justify-between items-center mb-2">
                                                    <span className="font-semibold text-gray-700">Traffic Status</span>
                                                    <span className="text-2xl">{getTrafficIcon(currentConditions.traffic.level)}</span>
                                                </div>
                                                <div className="text-sm text-gray-600">
                                                    <div>Level: <span className="font-bold capitalize">{currentConditions.traffic.level}</span></div>
                                                    {currentConditions.traffic.ratio && (
                                                        <div>Delay Factor: <span className="font-bold">{currentConditions.traffic.ratio}x</span></div>
                                                    )}
                                                </div>
                                            </div>

                                            <div className="bg-white p-3 rounded-lg">
                                                <div className="flex justify-between items-center mb-2">
                                                    <span className="font-semibold text-gray-700">Weather Conditions</span>
                                                    <span className="text-2xl">{getWeatherIcon(currentConditions.weather.condition)}</span>
                                                </div>
                                                <div className="text-sm text-gray-600">
                                                    <div>Condition: <span className="font-bold capitalize">{currentConditions.weather.description}</span></div>
                                                    <div>Temperature: <span className="font-bold">{currentConditions.weather.temperature}°C</span></div>
                                                    <div>Humidity: <span className="font-bold">{currentConditions.weather.humidity}%</span></div>
                                                    {currentConditions.weather.rain_volume > 0 && (
                                                        <div>Rain: <span className="font-bold">{currentConditions.weather.rain_volume}mm/h</span></div>
                                                    )}
                                                </div>
                                            </div>

                                            
                                        </div>
                                    </div>
                                )}

                                {/* Mail Statistics */}
                                {deliveries.length > 0 && (
                                    <div className="bg-white p-4 rounded-lg shadow">
                                        <h3 className="font-bold mb-3 text-gray-700 flex items-center">
                                            <span className="text-lg mr-2">📊</span> 
                                            Mail Statistics
                                        </h3>
                                        <div className="space-y-2">
                                            <div className="flex justify-between items-center p-2 bg-gray-50 rounded">
                                                <span className="text-sm font-semibold">Total Deliveries:</span>
                                                <span className="text-lg font-bold text-blue-600">{deliveries.length}</span>
                                            </div>
                                            <div className="flex justify-between items-center p-2 bg-red-50 rounded">
                                                <span className="text-sm font-semibold text-red-700">🔴 Urgent:</span>
                                                <span className="text-lg font-bold text-red-600">{urgentCount}</span>
                                            </div>
                                            <div className="flex justify-between items-center p-2 bg-blue-50 rounded">
                                                <span className="text-sm font-semibold text-blue-700">🔵 Regular:</span>
                                                <span className="text-lg font-bold text-blue-600">{regularCount}</span>
                                            </div>
                                        </div>
                                    </div>
                                )}

                                {/* View Mail List Button */}
                                {deliveries.length > 0 && currentView !== 'mailList' && currentView !== 'upload' && (
                                    <button
                                        onClick={() => setCurrentView('mailList')}
                                        className="w-full bg-gradient-to-r from-indigo-500 to-purple-600 text-white py-3 rounded-lg font-semibold hover:from-indigo-600 hover:to-purple-700 transition-all shadow"
                                    >
                                        📋 View All Mail Classification
                                    </button>
                                )}

                                {/* Optimize Button */}
                                {deliveries.length > 0 && currentView === 'mailList' && (
                                    <button
                                        onClick={optimizeRoutes}
                                        disabled={loading}
                                        className="w-full bg-gradient-to-r from-blue-600 to-indigo-600 text-white py-4 rounded-lg font-bold text-lg hover:from-blue-700 hover:to-indigo-700 disabled:from-gray-400 disabled:to-gray-500 transition-all shadow-lg hover:shadow-xl transform hover:-translate-y-1"
                                    >
                                        {loading ? '⏳ Optimizing...' : '🚀 Optimize Routes'}
                                    </button>
                                )}

                                {/* Route Comparison Results */}
                                {allRoutes && currentView === 'routes' && (
                                    <div className="bg-gradient-to-br from-green-50 to-emerald-50 p-4 rounded-lg shadow-lg border-2 border-green-200">
                                        <h3 className="font-bold mb-3 text-gray-800 flex items-center text-lg">
                                            <span className="mr-2">✅</span> 
                                            Route Optimization Results
                                        </h3>

                                        <div className="space-y-3">
                                            {/* Baseline Route */}
                                            <div className="bg-blue-100 p-3 rounded-lg border-2 border-blue-300">
                                                <div className="font-bold text-blue-800 mb-2">
                                                    🔵 Baseline
                                                </div>
                                                <div className="text-sm space-y-1">
                                                    <div>🚗 Distance: <strong>{allRoutes.results.nearest_neighbor.total_distance_km} km</strong></div>
                                                    <div>⏱️ Time: <strong>{(allRoutes.results.nearest_neighbor.total_time_hours * 60).toFixed(0)} min</strong></div>
                                                    <div>🎯 Urgent Success: <strong>{allRoutes.results.nearest_neighbor.urgent_on_time}%</strong></div>
                                                </div>
                                            </div>

                                            {/* Optimal Route */}
                                            <div className="bg-green-100 p-3 rounded-lg border-2 border-green-300">
                                                <div className="font-bold text-green-800 mb-2">
                                                    🎯 Optimal
                                                </div>
                                                <div className="text-sm space-y-1">
                                                    <div>🚗 Distance: <strong>{allRoutes.results[allRoutes.best_method].total_distance_km} km</strong></div>
                                                    <div>⏱️ Time: <strong>{(allRoutes.results[allRoutes.best_method].total_time_hours * 60).toFixed(0)} min</strong></div>
                                                    <div>🎯 Urgent Success: <strong>{allRoutes.results[allRoutes.best_method].urgent_on_time}%</strong></div>
                                                </div>
                                            </div>

                                            {/* Improvement */}
                                            <div className="bg-white p-3 rounded-lg shadow border-2 border-gray-200">
                                                <div className="font-bold text-gray-800 mb-2">💚 Improvement</div>
                                                <div className="text-sm space-y-1">
                                                    <div>Distance Saved: <span className="font-bold text-green-600">
                                                        {(allRoutes.results.nearest_neighbor.total_distance_km - allRoutes.results[allRoutes.best_method].total_distance_km).toFixed(2)} km
                                                    </span></div>
                                                    <div>Time Saved: <span className="font-bold text-green-600">
                                                        {((allRoutes.results.nearest_neighbor.total_time_hours - allRoutes.results[allRoutes.best_method].total_time_hours) * 60).toFixed(0)} min
                                                    </span></div>
                                                    <div>Improvement: <span className="font-bold text-green-600">
                                                        {allRoutes.results[allRoutes.best_method].improvement_pct}%
                                                    </span></div>
                                                </div>
                                            </div>

                                            <button
                                                onClick={() => {
                                                    setCurrentView('mailList');
                                                    setAllRoutes(null);
                                                }}
                                                className="w-full bg-gray-600 text-white py-2 rounded-lg font-semibold hover:bg-gray-700 transition-all"
                                            >
                                                ↩️ Back to Mail List
                                            </button>
                                        </div>

                                        {/* Customer Relocation Section */}
                                        <div className="pt-4 mt-4 border-t-2 border-green-300">
                                            <h4 className="font-bold text-gray-700 mb-3">
                                                📍 Customer Relocation
                                            </h4>
                                            
                                            <div className="space-y-3">
                                                <div>
                                                    <label className="block text-sm font-semibold mb-2">
                                                        Select Customer
                                                    </label>
                                                    <select
                                                        value={selectedDeliveryId || ''}
                                                        onChange={(e) => {
                                                            setSelectedDeliveryId(Number(e.target.value));
                                                            setNewAddress('');
                                                            setNewLatitude('');
                                                            setNewLongitude('');
                                                        }}
                                                        className="w-full p-2 border-2 border-green-300 rounded-lg"
                                                    >
                                                        <option value="">Choose customer...</option>
                                                        {deliveries.map(d => (
                                                            <option key={d.id} value={d.id}>
                                                                #{d.id}: {d.address.substring(0, 30)}...
                                                            </option>
                                                        ))}
                                                    </select>
                                                </div>

                                                {selectedDeliveryId && (
                                                    <>
                                                        <div className="bg-blue-50 p-2 rounded border border-blue-300">
                                                            <div className="text-xs text-blue-800">
                                                                <strong>Current Address:</strong><br/>
                                                                {deliveries.find(d => d.id === selectedDeliveryId)?.address}
                                                            </div>
                                                        </div>

                                                        <div>
                                                            <label className="block text-sm font-semibold mb-2">
                                                                New Address
                                                            </label>
                                                            <textarea
                                                                value={newAddress}
                                                                onChange={(e) => setNewAddress(e.target.value)}
                                                                placeholder="Enter new address..."
                                                                rows="2"
                                                                className="w-full p-2 border-2 border-green-300 rounded-lg text-sm"
                                                            />
                                                        </div>

                                                        <button
                                                            onClick={handleGeocodeNewAddress}
                                                            disabled={!newAddress || loading}
                                                            className="w-full bg-gradient-to-r from-blue-500 to-cyan-600 text-white py-2 rounded-lg font-semibold hover:from-blue-600 hover:to-cyan-700 disabled:from-gray-400 disabled:to-gray-500 transition-all text-sm"
                                                        >
                                                            {loading ? '⏳ Geocoding...' : '🔍 Get Coordinates'}
                                                        </button>

                                                        {(newLatitude || newLongitude) && (
                                                            <div className="bg-green-50 p-3 rounded-lg border-2 border-green-300">
                                                                <div className="text-sm font-semibold text-green-800 mb-2">
                                                                    ✅ Coordinates Found
                                                                </div>
                                                                <div className="grid grid-cols-2 gap-2">
                                                                    <div>
                                                                        <label className="block text-xs font-semibold mb-1">
                                                                            Latitude
                                                                        </label>
                                                                        <input
                                                                            type="number"
                                                                            step="0.0001"
                                                                            value={newLatitude}
                                                                            onChange={(e) => setNewLatitude(e.target.value)}
                                                                            className="w-full p-2 border border-green-300 rounded text-sm"
                                                                        />
                                                                    </div>
                                                                    <div>
                                                                        <label className="block text-xs font-semibold mb-1">
                                                                            Longitude
                                                                        </label>
                                                                        <input
                                                                            type="number"
                                                                            step="0.0001"
                                                                            value={newLongitude}
                                                                            onChange={(e) => setNewLongitude(e.target.value)}
                                                                            className="w-full p-2 border border-green-300 rounded text-sm"
                                                                        />
                                                                    </div>
                                                                </div>
                                                            </div>
                                                        )}

                                                        <button
                                                            onClick={compareRelocation}
                                                            disabled={!newLatitude || !newLongitude || loading}
                                                            className="w-full bg-gradient-to-r from-purple-500 to-pink-600 text-white py-3 rounded-lg font-bold hover:from-purple-600 hover:to-pink-700 disabled:from-gray-400 disabled:to-gray-500 transition-all shadow"
                                                        >
                                                            {loading ? '⏳ Analyzing...' : '🔍 Analyze Relocation Impact'}
                                                        </button>
                                                    </>
                                                )}
                                            </div>
                                        </div>
                                    </div>
                                )}

                                {/* Relocation Comparison Results */}
                                {relocationRoutes && currentView === 'relocation' && relocationData && (
                                    <div className="bg-gradient-to-br from-purple-50 to-pink-50 p-4 rounded-lg shadow-lg border-2 border-purple-300">
                                        <h3 className="font-bold mb-3 text-gray-800 flex items-center text-lg">
                                            <span className="mr-2">📍</span> 
                                            Relocation Impact Analysis
                                        </h3>

                                        <div className="space-y-3">
                                            {/* Relocation Details */}
                                            <div className="bg-orange-100 p-3 rounded-lg border-2 border-orange-300">
                                                <div className="font-bold text-orange-800 mb-2">
                                                    📦 Relocation Details
                                                </div>
                                                <div className="text-sm space-y-1">
                                                    <div><strong>Customer ID:</strong> #{relocationData.location_id}</div>
                                                    <div><strong>Old Address:</strong><br/>{relocationData.address}</div>
                                                    <div><strong>New Address:</strong><br/>{relocationData.new_address || 'Custom Coordinates'}</div>
                                                    <div className="pt-2 border-t border-orange-300">
                                                        <strong>Distance Moved:</strong> <span className="text-lg font-bold text-orange-700">{relocationData.distance_change_km} km</span>
                                                    </div>
                                                </div>
                                            </div>

                                            {/* Before/After Comparison */}
                                            <div className="bg-blue-100 p-3 rounded-lg border-2 border-blue-300">
                                                <div className="font-bold text-blue-800 mb-2">
                                                    🔵 Before Relocation
                                                </div>
                                                <div className="text-sm space-y-1">
                                                    <div>🚗 Distance: <strong>{relocationRoutes.original.results[relocationRoutes.original.best_method].total_distance_km} km</strong></div>
                                                    <div>⏱️ Time: <strong>{(relocationRoutes.original.results[relocationRoutes.original.best_method].total_time_hours * 60).toFixed(0)} min</strong></div>
                                                    <div>🎯 Urgent Success: <strong>{relocationRoutes.original.results[relocationRoutes.original.best_method].urgent_on_time}%</strong></div>
                                                </div>
                                            </div>

                                            <div className="bg-green-100 p-3 rounded-lg border-2 border-green-300">
                                                <div className="font-bold text-green-800 mb-2">
                                                    🟢 After Relocation
                                                </div>
                                                <div className="text-sm space-y-1">
                                                    <div>🚗 Distance: <strong>{relocationRoutes.new.results[relocationRoutes.new.best_method].total_distance_km} km</strong></div>
                                                    <div>⏱️ Time: <strong>{(relocationRoutes.new.results[relocationRoutes.new.best_method].total_time_hours * 60).toFixed(0)} min</strong></div>
                                                    <div>🎯 Urgent Success: <strong>{relocationRoutes.new.results[relocationRoutes.new.best_method].urgent_on_time}%</strong></div>
                                                </div>
                                            </div>

                                            {/* Impact Analysis */}
                                            <div className="bg-white p-3 rounded-lg shadow border-2 border-gray-200">
                                                <div className="font-bold text-gray-800 mb-2">📊 Route Impact</div>
                                                <div className="text-sm space-y-1">
                                                    <div>Distance Change: <span className={`font-bold ${
                                                        (relocationRoutes.new.results[relocationRoutes.new.best_method].total_distance_km - 
                                                         relocationRoutes.original.results[relocationRoutes.original.best_method].total_distance_km) > 0 
                                                            ? 'text-red-600' : 'text-green-600'
                                                    }`}>
                                                        {(relocationRoutes.new.results[relocationRoutes.new.best_method].total_distance_km - 
                                                          relocationRoutes.original.results[relocationRoutes.original.best_method].total_distance_km) > 0 ? '+' : ''}
                                                        {(relocationRoutes.new.results[relocationRoutes.new.best_method].total_distance_km - 
                                                          relocationRoutes.original.results[relocationRoutes.original.best_method].total_distance_km).toFixed(2)} km
                                                    </span></div>
                                                    <div>Time Change: <span className={`font-bold ${
                                                        ((relocationRoutes.new.results[relocationRoutes.new.best_method].total_time_hours - 
                                                          relocationRoutes.original.results[relocationRoutes.original.best_method].total_time_hours) * 60) > 0 
                                                            ? 'text-red-600' : 'text-green-600'
                                                    }`}>
                                                        {((relocationRoutes.new.results[relocationRoutes.new.best_method].total_time_hours - 
                                                           relocationRoutes.original.results[relocationRoutes.original.best_method].total_time_hours) * 60) > 0 ? '+' : ''}
                                                        {((relocationRoutes.new.results[relocationRoutes.new.best_method].total_time_hours - 
                                                           relocationRoutes.original.results[relocationRoutes.original.best_method].total_time_hours) * 60).toFixed(0)} min
                                                    </span></div>
                                                </div>
                                            </div>

                                            <button
                                                onClick={() => {
                                                    setCurrentView('routes');
                                                    setRelocationRoutes(null);
                                                    setRelocationData(null);
                                                    setSelectedDeliveryId(null);
                                                    setNewAddress('');
                                                    setNewLatitude('');
                                                    setNewLongitude('');
                                                }}
                                                className="w-full bg-gray-600 text-white py-2 rounded-lg font-semibold hover:bg-gray-700 transition-all"
                                            >
                                                ↩️ Back to Routes
                                            </button>
                                        </div>
                                    </div>
                                )}
                            </div>
                        </div>

                        {/* Main Content Area */}
                        <div className="flex-1 overflow-hidden">
                            {currentView === 'upload' && (
                                <div className="flex items-center justify-center h-full bg-gradient-to-br from-blue-50 to-indigo-50">
                                    <div className="text-center p-8 bg-white rounded-lg shadow-xl max-w-md">
                                        <div className="text-6xl mb-4">📤</div>
                                        <p className="text-gray-700 text-xl font-semibold mb-2">Upload Your Mail Data</p>
                                        <p className="text-gray-500 text-sm mb-4">Upload a CSV file with mail delivery information to get started</p>
                                        <div className="text-xs text-gray-400 text-left bg-gray-50 p-3 rounded">
                                            <p className="font-semibold mb-1">Required CSV columns:</p>
                                            <ul className="list-disc list-inside space-y-1">
                                                <li>address</li>
                                                <li>mail_type</li>
                                                <li>latitude (optional)</li>
                                                <li>longitude (optional)</li>
                                            </ul>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {currentView === 'mailList' && (
                                <div className="h-full overflow-y-auto bg-gray-50 p-6">
                                    <div className="max-w-6xl mx-auto">
                                        <h2 className="text-2xl font-bold mb-4 text-gray-800">📋 Mail Classification List</h2>
                                        
                                        <div className="bg-white rounded-lg shadow-lg overflow-hidden">
                                            <table className="w-full">
                                                <thead className="bg-gradient-to-r from-blue-600 to-indigo-600 text-white">
                                                    <tr>
                                                        <th className="px-4 py-3 text-left">#</th>
                                                        <th className="px-4 py-3 text-left">Address</th>
                                                        <th className="px-4 py-3 text-left">Mail Type</th>
                                                        <th className="px-4 py-3 text-center">Priority</th>
                                                    </tr>
                                                </thead>
                                                <tbody>
                                                    {deliveries.map((delivery, idx) => (
                                                        <tr key={delivery.id} className={`border-b hover:bg-gray-50 ${idx % 2 === 0 ? 'bg-white' : 'bg-gray-50'}`}>
                                                            <td className="px-4 py-3 font-semibold text-gray-600">
                                                                {idx + 1}
                                                            </td>
                                                            <td className="px-4 py-3">
                                                                <div className="text-sm font-medium text-gray-800">
                                                                    {delivery.address}
                                                                </div>
                                                                <div className="text-xs text-gray-500">
                                                                    {delivery.latitude.toFixed(4)}, {delivery.longitude.toFixed(4)}
                                                                </div>
                                                            </td>
                                                            <td className="px-4 py-3">
                                                                <span className="text-sm font-medium text-gray-700">
                                                                    {delivery.mail_type}
                                                                </span>
                                                            </td>
                                                            <td className="px-4 py-3 text-center">
                                                                <span className={`inline-block px-3 py-1 rounded-full text-xs font-bold ${
                                                                    delivery.priority === 'urgent' 
                                                                        ? 'bg-red-100 text-red-700 border border-red-300' 
                                                                        : 'bg-blue-100 text-blue-700 border border-blue-300'
                                                                }`}>
                                                                    {delivery.priority === 'urgent' ? '🔴 URGENT' : '🔵 REGULAR'}
                                                                </span>
                                                            </td>
                                                        </tr>
                                                    ))}
                                                </tbody>
                                            </table>
                                        </div>

                                        <div className="mt-6 bg-white p-4 rounded-lg shadow flex justify-between items-center">
                                            <div className="text-sm text-gray-600">
                                                Showing <strong>{deliveries.length}</strong> deliveries
                                                ({urgentCount} urgent, {regularCount} regular)
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {currentView === 'routes' && allRoutes && (
                                <MapView 
                                    deliveries={deliveries}
                                    route={null}
                                    center={mapCenter}
                                    showRoute={false}
                                    comparisonMode={true}
                                    baselineRoute={allRoutes.results.nearest_neighbor.deliveries.slice(1)}
                                    optimalRoute={allRoutes.results[allRoutes.best_method].deliveries.slice(1)}
                                    showLabels={false}
                                />
                            )}

                            {currentView === 'relocation' && relocationRoutes && relocationData && (
                                <MapView 
                                    deliveries={deliveries}
                                    route={null}
                                    center={mapCenter}
                                    showRoute={false}
                                    comparisonMode={false}
                                    relocationMode={true}
                                    relocationData={relocationData}
                                    baselineRoute={relocationRoutes.original.results[relocationRoutes.original.best_method].deliveries.slice(1)}
                                    optimalRoute={relocationRoutes.new.results[relocationRoutes.new.best_method].deliveries.slice(1)}
                                    afterDeliveries={relocationRoutes.updatedDeliveries}
                                    showLabels={false}
                                />
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
